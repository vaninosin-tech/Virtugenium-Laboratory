<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>AgCl: стенд опыта</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #cfd8dc; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #panes { position: fixed; inset: 0 0 64px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: #222; }
  .pane { position: relative; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #videoBox video { position: absolute; top: 0; left: 0; }
  .label { position: absolute; left: 10px; top: 8px; font-weight: 600; text-shadow: 0 0 4px #000; pointer-events: none; }
  #hud { position: absolute; left: 10px; top: 28px; white-space: pre; opacity: .8; pointer-events: none; text-shadow: 0 0 4px #000; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #0b0f12; }
  #bar input[type=range] { flex: 1; }
  #bar button { background: #1b262d; color: #cfd8dc; border: 1px solid #34454f; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  #bar small { opacity: .6; }
</style></head>
<body>
<div id="panes">
  <div class="pane"><canvas id="view"></canvas><div class="label">Моя реализация</div><div id="hud"></div></div>
  <div class="pane" id="videoBox"><video id="ref" src="/ref/agcl.mp4" muted playsinline preload="auto"></video><div class="label">Ролик (эталон)</div></div>
</div>
<div id="bar">
  <button id="play">Пауза</button><button id="restart">Заново</button>
  <input id="scrub" type="range" min="0" max="19" step="0.05" value="0">
  <span id="clock"></span>
  <button id="vminus">видео −0.5 с</button><button id="vplus">видео +0.5 с</button>
  <button id="rate">скорость видео x1</button>
  <button id="pour">налив: быстро</button>
  <small>Пробел: пауза · ←/→: ±1 с</small>
</div>
<script type="module" src="/src/lab/experimentLab.ts"></script>
</body></html>
