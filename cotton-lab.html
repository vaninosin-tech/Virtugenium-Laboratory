<!doctype html>
<html><head><meta charset="utf-8"><title>cotton lab</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:640px;height:640px}</style></head>
<body><canvas id="c" width="640" height="640"></canvas>
<script type="module">
const params = new URLSearchParams(location.search);
const bg = parseFloat(params.get("bg") ?? "0");
const seed = parseFloat(params.get("seed") ?? "1");
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true });
const vs = `#version 300 es
in vec2 pos; out vec2 uv; void main(){ uv = pos; gl_Position = vec4(pos,0.,1.); }`;
const fs = `#version 300 es
precision highp float;
in vec2 uv; out vec4 outColor;
uniform float uSeed, uBg;
float hash(vec3 p){ p = fract(p*0.3183099+vec3(0.1,0.2,0.3)+uSeed*0.137); p*=17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<3;i++){ s+=a*noise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s; }
float billow(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<3;i++){ s+=a*abs(2.0*noise(p)-1.0); p=p*2.1+vec3(5.3,1.1,7.7); a*=0.5; } return s; }
// Base: a few lobes of a connected mass, tube-like column (x: width 2R, y: height).
float lobes(vec3 p){
  float d = 0.0;
  d += exp(-dot((p-vec3(-0.10, 0.55, 0.0))*vec3(1.0,0.9,1.0),(p-vec3(-0.10, 0.55, 0.0))*vec3(1.0,0.9,1.0))/0.20);
  d += exp(-dot((p-vec3( 0.18, 0.15, 0.1))*vec3(1.1,0.8,1.0),(p-vec3( 0.18, 0.15, 0.1))*vec3(1.1,0.8,1.0))/0.16);
  d += exp(-dot((p-vec3(-0.15,-0.25,-0.1))*vec3(1.0,0.8,1.0),(p-vec3(-0.15,-0.25,-0.1))*vec3(1.0,0.8,1.0))/0.22);
  d += 0.8*exp(-dot((p-vec3( 0.12,-0.62, 0.0))*vec3(1.0,0.9,1.0),(p-vec3( 0.12,-0.62, 0.0))*vec3(1.0,0.9,1.0))/0.15);
  d += 0.7*exp(-dot((p-vec3(0.0,0.0,0.0))*vec3(2.5,0.7,2.5),(p-vec3(0.0,0.0,0.0))*vec3(2.5,0.7,2.5))/0.10);
  return d;
}
float density(vec3 p){
  vec3 w = vec3(noise(p*1.7+vec3(3.0,1.0,2.0)), noise(p*1.7+vec3(7.0,5.0,1.0)), noise(p*1.7+vec3(2.0,9.0,4.0)))-0.5;
  vec3 q = p + w*0.30;
  float base = lobes(q);
  float lump = billow(q*4.6);
  float fold = fbm(q*8.0);
  float rim = 1.0 - smoothstep(0.35, 0.95, base);
  float big = billow(q*2.2);
  float field = base + (0.34 + 0.30*rim)*(lump-0.30) + 0.22*(big-0.30) + (0.10 + 0.16*rim)*(fold-0.5);
  // Feathery tufts exist only at the rim of the mass.
  field += rim * 0.42 * (fbm(q*15.0) - 0.45) + rim * 0.20 * (noise(q*37.0) - 0.5);
  return smoothstep(0.60, 0.72, field);
}
void main(){
  vec3 ro = vec3(uv*0.95, -1.6), rd = vec3(0.,0.,1.);
  float t = 0.0, dt = 0.045; vec3 acc = vec3(0.0); float alpha = 0.0;
  vec3 L = normalize(vec3(0.45,0.7,-0.55));
  for(int i=0;i<72;i++){
    vec3 p = ro + rd*(t+0.0001);
    t += dt; if(t>3.2) break;
    if(abs(p.x)>1.0||abs(p.y)>1.0) continue;
    float d = density(p);
    if(d < 0.003) continue;
    // Self shadow: a few taps toward the light.
    float sh = 0.0;
    for(int k=1;k<=3;k++) sh += density(p + L*0.12*float(k));
    float lit = exp(-sh*0.9);
    float diff = clamp(0.5 + (density(p + L*0.06) - d)*-3.0, 0.0, 1.0);
    float shade = 0.70 + 0.22*lit + 0.10*diff;
    vec3 col = vec3(1.0, 1.0, 0.995) * shade;
    float a = 1.0 - exp(-d*dt*26.0);
    acc += (1.0-alpha)*a*col; alpha += (1.0-alpha)*a;
    if(alpha>0.985) break;
  }
  vec3 bgc = vec3(uBg);
  outColor = vec4(acc + (1.0-alpha)*bgc, 1.0);
}`;
const make = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { document.title = "ERR"; console.error(gl.getShaderInfoLog(s)); } return s; };
const prog = gl.createProgram();
gl.attachShader(prog, make(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, make(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "pos"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
gl.uniform1f(gl.getUniformLocation(prog, "uSeed"), seed);
gl.uniform1f(gl.getUniformLocation(prog, "uBg"), bg);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
document.title = "done";
</script></body></html>
